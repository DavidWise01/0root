<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Prims - 10 generations - single cell</title>
<style>
body{margin:0;background:#050510;color:#e5e7eb;font-family:monospace;overflow:hidden}
canvas{display:block}
#info{position:absolute;left:12px;top:10px;font-size:12px;background:#000000cc;padding:12px 14px;border-radius:12px;border:1px solid #ffffff18;line-height:1.55;max-width:min(520px,92vw)}
b{color:#fcd34d}
.dim{color:#a78bfa}
.ok{color:#86efac}
#expr{margin-top:8px;color:#fde68a;word-break:break-all;font-size:12px}
</style></head><body>
<canvas id="c"></canvas>
<div id="info">
<b>PRIMS</b> <span class="dim">single cell → 10 generations</span><br/>
<span id="gen">generation 1 / 10</span><br/>
<span id="role">h · the cell</span><br/>
<div id="expr">h</div>
<div id="seal"></div>
</div>
<script>
const TARGET = "{ (e(e(e(silver(gold(mercury(iron(steel(h)o)n)c)he)e)e)e }";
const wraps = [
  { name:"h",       role:"h · the single cell",            col:"#a5f3fc", kind:"core" },
  { name:"steel",   role:"steel around the cell",          col:"#94a3b8", kind:"steel" },
  { name:"iron",    role:"iron closes, oxygen beside it",  col:"#f87171", kind:"iron" },
  { name:"mercury", role:"mercury closes, nitrogen beside it", col:"#67e8f9", kind:"mercury" },
  { name:"gold",    role:"gold closes, carbon beside it",  col:"#fcd34d", kind:"gold" },
  { name:"silver",  role:"silver closes, helium beside it", col:"#e5e7eb", kind:"silver" },
  { name:"e",       role:"first e",                        col:"#c084fc", kind:"e" },
  { name:"e",       role:"second e",                       col:"#a78bfa", kind:"e" },
  { name:"e",       role:"third e",                        col:"#7c3aed", kind:"e" },
  { name:"{",       role:"the universe brace",             col:"#fde68a", kind:"brace" },
];
function grow(){
  let e = "h";
  const out = [e];
  const step = [
    x => "steel(" + x + ")",
    x => "iron(" + x + "o)",
    x => "mercury(" + x + "n)",
    x => "gold(" + x + "c)",
    x => "silver(" + x + "he)",
    x => "e(" + x + "e)",
    x => "e(" + x + "e)",
    x => "e(" + x + "e)",
    x => "{ (" + x.slice(0, -1) + " }",
  ];
  for (const f of step){ e = f(e); out.push(e); }
  return out;
}
const expr = grow();
if (expr.length !== 10 || expr[9] !== TARGET){
  throw new Error("generation 10 did not land on the formula");
}
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
let w, h, t = 0, gen = 0, hold = 0;
function resize(){
  w = canvas.width = innerWidth * 2;
  h = canvas.height = innerHeight * 2;
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
}
addEventListener("resize", resize); resize();
function paintInfo(){
  document.getElementById("gen").textContent = "generation " + (gen + 1) + " / 10 · prim " + (gen + 1);
  document.getElementById("role").textContent = wraps[gen].role;
  document.getElementById("expr").textContent = expr[gen];
  const seal = document.getElementById("seal");
  if (gen === 9){
    seal.className = "ok";
    seal.textContent = "WORKED. ten generations. the cell is the formula.";
  } else {
    seal.className = "dim";
    seal.textContent = "working";
  }
}
function loop(){
  t += 0.01;
  hold += 1;
  if (hold > 150){
    hold = 0;
    gen = (gen + 1) % 10;
    paintInfo();
  }
  ctx.fillStyle = "rgba(5,5,16,0.22)";
  ctx.fillRect(0, 0, w, h);
  const cx = w * 0.62, cy = h * 0.52;
  const breath = (Math.sin(t * 0.2) + 1) / 2;
  if (gen === 9){
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = "#fde68a";
    ctx.lineWidth = 1.4;
    ctx.strokeRect(cx - 210, cy - 210, 420, 420);
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = "#fde68a";
    ctx.font = "12px monospace";
    ctx.fillText("{", cx - 224, cy - 196);
    ctx.fillText("}", cx + 198, cy + 206);
  }
  for (let i = gen; i >= 0; i--){
    const s = wraps[i];
    if (s.kind === "brace") continue;
    const R = 16 + i * 22 + breath * (i === 0 ? 4 : 1.5);
    ctx.globalAlpha = 0.28 + (i === gen ? 0.45 : 0.12);
    ctx.strokeStyle = s.col;
    ctx.lineWidth = i === 0 ? 0 : 1.3;
    if (i > 0){
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    }
    if (i === gen && i > 0){
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = s.col;
      ctx.font = "11px monospace";
      ctx.fillText(s.name, cx + R + 8, cy);
    }
  }
  const core = 7 + breath * 5;
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#a5f3fc";
  ctx.shadowColor = "#38bdf8";
  ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.arc(cx, cy, core, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = "#c4b5fd";
  ctx.font = "12px monospace";
  ctx.textAlign = "center";
  ctx.fillText("prim " + (gen + 1) + " / 10", cx, cy + 250);
  ctx.textAlign = "left";
  requestAnimationFrame(loop);
}
paintInfo();
addEventListener("click", function(){
  hold = 0;
  gen = (gen + 1) % 10;
  paintInfo();
});
loop();
</script>
</body></html>
