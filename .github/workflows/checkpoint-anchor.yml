name: ROOT0 Hallway — anchor signed corpus checkpoint
on:
  workflow_dispatch:
    inputs:
      checkpoint_seq:
        description: "TOPH checkpoint sequence (not a witness vote)"
        required: true
        type: string
      checkpoint_hash:
        description: "Exact signed TOPH checkpoint event SHA-256"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: root0-hallway-checkpoint-master
  cancel-in-progress: false
jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Install public-key verifier
        run: python3 -m pip install 'cryptography==50.0.2'
      - name: Validate independent 0root pins and historical anchors
        run: python3 memory-bridge/checkpoint_receiver.py verify-local
      - name: Read source, validate signed checkpoint, append independent anchor file
        env:
          SEQ: ${{ inputs.checkpoint_seq }}
          HASH: ${{ inputs.checkpoint_hash }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SEQ" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid checkpoint sequence"; exit 1; }
          [[ "$HASH" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid checkpoint SHA-256"; exit 1; }
          python3 memory-bridge/checkpoint_receiver.py receive --seq "$SEQ" --hash "$HASH"
          python3 memory-bridge/checkpoint_receiver.py verify-local
      - name: Record independent append-only anchor in Hallway Git
        env:
          HASH: ${{ inputs.checkpoint_hash }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "root0-checkpoint-anchor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "memory-bridge/checkpoints/$HASH.json"
          git diff --cached --quiet && { echo "No checkpoint anchor"; exit 1; }
          git commit -m "memory(anchor): independently pin signed ROOT0 corpus checkpoint"
          git push origin HEAD:master
